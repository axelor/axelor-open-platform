---
title: Improve `@DynamicUpdate` support
type: change
description: |
  Currently, `@DynamicUpdate` is added on entity having a computed persisted field.
  The annotation prevents using cached `PreparedStatement` but it generates a new SQL string specifically for that 
  transaction, compiles it, and executes it. 
  
  We now apply this annotation only when the cost of generating the SQL is outweighed by the savings in database I/O.
  Cases are : 
  - large tables (more than 100 XML-declared column-backed fields): prevent massive, unnecessary data payloads
  - tables with large objects (binary/large fields): ensure heavy binary/large data is not re-transmitted unless it is 
  actually changed
  
  Also, allow enabling/disabling the `@DynamicUpdate` support on demand per entity through the `dynamicUpdate`
  attribute for more control.

  JSON fields like `attrs` do not trigger `@DynamicUpdate` automatically because their runtime size is unknown
  and most entities leave `attrs` empty. Users should set `dynamicUpdate="true"` explicitly on entities with large JSON payloads.
