---
title: Log user logins
type: feature
description: | 
  Successful authentication attempts are now recorded as AuthenticationEvent. Users can see the history of their own 
  attempts from the user and preferences forms. Admins can see the attempts of every user from the new "Connections" 
  menu. Direct clients such as API key and basic authentication are excluded, and external providers only report their 
  successful logins. Events older than 180 days are deleted daily by the new "authentication.events.purge" scheduled 
  job. The retention period can be changed with the "auth.events.retention" setting.
